name: Publish npm

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    permissions:
      actions: write
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build-linux-x64
            os: ubuntu-24.04
            platform: linux
            arch: x64
            binary: result/bin/ccusage
          - name: build-mac-arm64
            os: macos-26
            platform: darwin
            arch: arm64
            binary: result/bin/ccusage
          - name: build-windows-x64
            os: windows-2025
            platform: win32
            arch: x64
            binary: rust/target/release/ccusage.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-linux-native-package
        if: matrix.platform == 'linux'
        with:
          arch: ${{ matrix.arch }}
          binary: ${{ matrix.binary }}
          cache-scope: ${{ matrix.name }}
      - uses: ./.github/actions/build-macos-nix-native-package
        if: matrix.platform == 'darwin'
        with:
          arch: ${{ matrix.arch }}
          binary: ${{ matrix.binary }}
          cache-scope: ${{ matrix.name }}
      - uses: ./.github/actions/build-windows-native-package
        if: matrix.platform == 'win32'
        with:
          arch: ${{ matrix.arch }}
          binary: ${{ matrix.binary }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-cache
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          registry-url: 'https://registry.npmjs.org'
          node-version: lts/*
          package-manager-cache: false
      - run: nix profile install --inputs-from . nixpkgs#pnpm .#publint
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ccusage-native-*
          path: ${{ runner.temp }}/native-packages
          merge-multiple: true
      - name: Restore native package binaries
        run: |
          for archive in "$RUNNER_TEMP"/native-packages/*.tar; do
            tar -xf "$archive"
          done
      - name: Set unique npm version
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';

          const packageFiles = [
            'package.json',
            'apps/ccusage/package.json',
            'packages/ccusage-linux-x64/package.json',
            'packages/ccusage-darwin-arm64/package.json',
            'packages/ccusage-win32-x64/package.json',
          ];
          const packages = packageFiles.map((file) => [file, JSON.parse(fs.readFileSync(file, 'utf8'))]);
          const versions = new Set(packages.map(([, manifest]) => manifest.version));
          if (versions.size !== 1) {
            throw new Error(`package versions are not synchronized: ${[...versions].join(', ')}`);
          }

          const checkedInVersion = [...versions][0].split('-', 1)[0];
          const [major, minor, patch] = checkedInVersion.split('.').map(Number);
          if (![major, minor, patch].every(Number.isSafeInteger)) {
            throw new Error(`invalid checked-in version: ${checkedInVersion}`);
          }
          const baseVersion = `${major}.${minor}.${patch + 1}`;
          const version = `${baseVersion}-fork.${process.env.RUN_ID}.${process.env.RUN_ATTEMPT}`;
          for (const [file, manifest] of packages) {
            manifest.version = version;
            fs.writeFileSync(file, `${JSON.stringify(manifest, null, '\t')}\n`);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `NPM_VERSION=${version}\n`);
          console.log(`Publishing ${version}`);
          JS
      - name: Publish native packages
        run: |
          pnpm \
            --filter='./packages/ccusage-linux-x64' \
            --filter='./packages/ccusage-darwin-arm64' \
            --filter='./packages/ccusage-win32-x64' \
            publish --provenance --no-git-checks --access public --tag latest
      - name: Publish ccusage
        run: pnpm --filter='./apps/ccusage' publish --provenance --no-git-checks --access public --tag latest
      - name: Summarize publication
        run: echo "Published ccusage@$NPM_VERSION" >> "$GITHUB_STEP_SUMMARY"
